!
interface bond0
 ip address 10.0.50.1/30
!
bfd
 bundle coexistence bob-blb logical
 profile lag
  receive-interval 200
  transmit-interval 200
 !
 profile blb
  receive-interval 400
  transmit-interval 400
 !
 lag bond0
  ipv4 dest-addr 10.0.50.2
  profile lag
 exit
 !
 peer 10.0.50.2 interface bond0
  profile blb
 exit
 !
exit
!
